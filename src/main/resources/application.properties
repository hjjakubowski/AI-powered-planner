spring.application.name=ai-powered-planner

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY:disabled}
spring.ai.google.genai.chat.options.model=${GOOGLE_GENAI_MODEL:gemini-2.5-flash}

spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}
